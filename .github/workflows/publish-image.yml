name: Publish container image

on:
  push:
    branches: [main]
    paths:
      - "starter-app/**"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish versioned images
        uses: docker/build-push-action@v6
        with:
          context: starter-app
          push: true
          tags: |
            ghcr.io/slowlytv/atelier-git-avance:v1.0.0
            ghcr.io/slowlytv/atelier-git-avance:latest
