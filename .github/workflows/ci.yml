name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter-app

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restaurer le cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('starter-app/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Verifier le style
        run: flake8 . --max-line-length=100 --exclude=.venv

  test:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    defaults:
      run:
        working-directory: starter-app

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restaurer le cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('starter-app/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Lancer les tests avec couverture
        run: pytest -v --cov=. --cov-report=html

      - name: Conserver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-python-${{ matrix.python-version }}
          path: starter-app/htmlcov
          if-no-files-found: warn

  build-and-push:
    name: Construire et publier l'image Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Se connecter a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: starter-app
          push: true
          tags: |
            ghcr.io/slowlytv/atelier-git-avance:${{ github.sha }}
            ghcr.io/slowlytv/atelier-git-avance:latest
