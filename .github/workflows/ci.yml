name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('starter-app/requirements.txt') }}
      - run: python -m pip install -r requirements.txt
      - run: flake8 . --max-line-length=100 --exclude=.venv

  test:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: starter-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('starter-app/requirements.txt') }}
      - run: python -m pip install -r requirements.txt
      - run: pytest -v --cov=. --cov-report=html
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-python-${{ matrix.python-version }}
          path: starter-app/htmlcov

  build-and-push:
    name: Construire et publier l'image Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: starter-app
          push: true
          tags: |
            ghcr.io/slowlytv/atelier-git-avance:${{ github.sha }}
            ghcr.io/slowlytv/atelier-git-avance:latest

  deploy:
    name: Deployer en blue-green
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deployer et verifier le SHA
        working-directory: starter-app
        env:
          APP_IMAGE: ghcr.io/slowlytv/atelier-git-avance:${{ github.sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: ./deploy/deploy.sh
