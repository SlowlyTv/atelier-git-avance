x-app-environment: &app-environment
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  COMMIT_SHA: ${DEPLOY_SHA:-development}
  RELEASE_MESSAGE: ${RELEASE_MESSAGE:-atelier4-ready}

x-app: &app
  build:
    context: .
  image: ${APP_IMAGE:-atelier-git-avance:compose}
  restart: unless-stopped
  extra_hosts:
    - "redis:host-gateway"
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - atelier-network

services:
  app-blue:
    <<: *app
    profiles: ["blue"]
    ports:
      - "5001:5000"
    environment:
      <<: *app-environment
      DEPLOY_COLOR: blue

  app-green:
    <<: *app
    profiles: ["green"]
    ports:
      - "5002:5000"
    environment:
      <<: *app-environment
      DEPLOY_COLOR: green

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - atelier-network

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - atelier-network

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["blue"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      app-blue:
        condition: service_started
    networks:
      - atelier-network

networks:
  atelier-network:
    driver: bridge

volumes:
  redis-data:
